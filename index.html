<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>s4ndsc4p3</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { width: 100vw; height: 100vh; position: relative; }

  /* TITLE */
  #screen-title {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #title-text {
    font-size: clamp(28px, 8vw, 60px);
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.75);
  }

  /* CAMERA */
  #screen-camera {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
  }
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0.6;
  }
  #shutter {
    position: absolute;
    bottom: 10%;
    left: 50%; transform: translateX(-50%);
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.15);
    cursor: pointer;
    z-index: 10;
  }
  #flip-btn {
    position: absolute;
    bottom: 11.5%;
    right: 10%;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 10;
  }
  #video.mirror { transform: scaleX(-1); }

  /* COUNTDOWN overlay */
  #countdown-overlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(10,10,15,0.5);
    z-index: 20;
    font-size: clamp(80px, 25vw, 180px);
    color: #fff;
  }

  /* DISSOLVE canvas */
  #canvas {
    position: absolute; inset: 0;
    display: none;
  }

  /* HUD */
  #hud {
    position: fixed;
    top: 22px; left: 24px;
    display: none;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    z-index: 30;
    pointer-events: none;
  }
  #hud span {
    font-size: 13px;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.45);
  }
  /* PROCESSING overlay */
  #processing-overlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    z-index: 25;
    font-size: 13px;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.35);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50%       { opacity: 0.75; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="screen-title">
    <span id="title-text">s4ndsc4p3</span>
  </div>

  <div id="screen-camera">
    <video id="video" autoplay playsinline muted></video>
    <div id="shutter"></div>
    <div id="flip-btn">⟳</div>
  </div>

  <div id="countdown-overlay"></div>

  <canvas id="canvas"></canvas>
  <div id="hud">
    <span id="timer">2:49</span>
    <span id="particle-count"></span>
    <span id="airborne"></span>
    <span id="gs"></span>
    <span id="fps"></span>
    <span id="viscosity"></span>
    <span id="grav-info"></span>
    <span id="diag"></span>
    <span id="ver">v0.2.23</span>
  </div>
  <div id="processing-overlay">segmenting</div>
</div>

<!-- ?gs=N  grain size (default 3, range 1–8). GS=2 is 4× denser, GS=4 coarser/faster. -->
<script type="module" src="js/main.js?v=0.2.23"></script>
</body>
</html>
